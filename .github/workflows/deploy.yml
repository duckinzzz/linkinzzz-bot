name: Build & Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare compose payload
        run: echo "COMPOSE_B64=$(base64 -w0 docker-compose.yml)" >> "$GITHUB_ENV"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          envs: COMPOSE_B64
          script: |
            cd /srv/bots/linkinzzz-bot

            # compose живёт в репозитории. Без этой доставки файл на сервере отстаёт
            # от репо: так на прод не доехал volume ./data под кэш медиа, и база кэша
            # жила внутри контейнера, умирая при каждом --force-recreate
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml

            cat > .env <<EOF
            ENV=${{ secrets.ENV }}
            ADMIN_ID=${{ secrets.ADMIN_ID }}
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            BOT_USERNAME=${{ secrets.BOT_USERNAME }}
            BOTSTATS_API_TOKEN=${{ secrets.BOTSTATS_API_TOKEN }}            

            WEBHOOK_URL=${{ secrets.WEBHOOK_URL }}
            WEBHOOK_PATH=${{ secrets.WEBHOOK_PATH }}
            WEBHOOK_HOST=${{ secrets.WEBHOOK_HOST }}
            WEBHOOK_PORT=${{ secrets.WEBHOOK_PORT }}
            EOF

            IMAGE_TAG=${{ github.sha }}

            docker compose pull
            mkdir -p cookies
            mkdir -p data
            docker compose up -d --force-recreate --remove-orphans