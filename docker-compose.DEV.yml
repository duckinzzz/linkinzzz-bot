services:
  bot:
    build:
      context: .
      dockerfile: DEV.Dockerfile
    container_name: linkinzzz
    command: sh -c "watchfiles --filter python 'python run.py' core handlers utils run.py"
    env_file:
      - .env
    # host-сеть: трафик docker-бриджа не идёт через VPN (throne-tun) на хосте —
    # из бриджа недоступны ни api.telegram.org, ни instagram.com
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    volumes:
      - .:/app
